# CacheForge Configuration File
# Version 1.0 - Multi-Store Cache with Distributed Clustering

# Node Configuration
node:
  id: "cacheforge-node-1"
  data_dir: "/tmp/cacheforge-data"

# Network Configuration
network:
  bind_addr: "0.0.0.0"      # Bind to all interfaces
  port: 8080                # HTTP API port (RESP server runs on port + 1000)

# Cluster Configuration
cluster:
  seeds: []                 # Seed nodes for joining cluster (IP:port or DNS hostname)
  seed_dns: ""              # DNS hostname for seed discovery (e.g. headless K8s Service)
  seed_dns_port: 0          # Port to use with DNS-discovered seeds (default: gossip port)
  replication_factor: 3
  consistency_level: "eventual"   # "eventual" or "quorum"

# Persistence Configuration
persistence:
  enabled: true
  strategy: "hybrid"           # Options: "aof", "snapshot", "hybrid"
  enable_aof: true
  sync_policy: "everysec"      # Options: "always", "everysec", "no"
  sync_interval: "1s"
  snapshot_interval: "15m"
  max_log_size: "100MB"
  compression_level: 6         # 0-9, where 0=no compression, 9=max compression
  retain_logs: 3               # Number of old logs to keep

# Global Cache Configuration
cache:
  max_memory: "8GB"
  default_ttl: "0"            # 0 = infinite (no expiry); user sets TTL per-store or per-key
  cuckoo_filter_fpp: 0.01     # 1% false positive rate
  max_stores: 16              # Maximum stores allowed (1-64)

# Store Configurations
# Only "default" ships out of the box. Create additional stores via API or config.
# Store config is immutable after creation — to change, drop and recreate.
stores:
  - name: "default"
    eviction_policy: "lru"
    max_memory: "8GB"
    default_ttl: "0"              # 0 = infinite
    cuckoo_filter: true           # enable probabilistic lookups
    persistence: "hybrid"         # "hybrid", "aof", "snapshot", "disabled"

  # Example: uncomment to pre-create additional stores at startup
  # - name: "sessions"
  #   eviction_policy: "ttl"
  #   max_memory: "1GB"
  #   default_ttl: "30m"
  #   cuckoo_filter: true
  #   persistence: "aof"
  #
  # - name: "temp_cache"
  #   eviction_policy: "lfu"
  #   max_memory: "512MB"
  #   default_ttl: "15m"
  #   cuckoo_filter: false
  #   persistence: "disabled"

# Logging Configuration
logging:
  level: "info"              # debug, info, warn, error, fatal
  log_dir: "logs"            # Log directory

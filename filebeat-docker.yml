filebeat.inputs:
# CacheForge application logs from shared volume
- type: log
  enabled: true
  paths:
    - /var/log/cacheforge/node-*.log
  json.keys_under_root: true
  json.add_error_key: true
  fields:
    cacheforge_service: cacheforge
    environment: docker
    log_type: application
  fields_under_root: true

# Docker container logs - only CacheForge node containers
- type: container
  enabled: true
  paths:
    - '/var/lib/docker/containers/*/*.log'
  fields:
    cacheforge_service: cacheforge
    environment: docker
    log_type: container
  fields_under_root: true

processors:
# Add Docker metadata
- add_docker_metadata:
    host: "unix:///var/run/docker.sock"

# Drop logs from non-CacheForge-node containers (Grafana, Elasticsearch, Filebeat, volume-init)
- drop_event:
    when:
      not:
        regexp:
          container.name: "^cacheforge-node[0-9]+$"

# Extract node ID from container name
- script:
    lang: javascript
    source: >
      function process(event) {
        var container = event.Get("container");
        if (container && container.name && typeof container.name === 'string') {
          if (container.name.indexOf("cacheforge-") === 0) {
            event.Put("cacheforge.node_id", container.name.replace("cacheforge-", ""));
          }
        }
      }

output.elasticsearch:
  hosts: ["cacheforge-elasticsearch:9200"]
  index: "cacheforge-logs-%{+yyyy.MM.dd}"
  template.enabled: true
  template.pattern: "cacheforge-logs-*"

setup.template.enabled: true
setup.template.name: "cacheforge-logs"
setup.template.pattern: "cacheforge-logs-*"
setup.template.settings:
  index.number_of_shards: 1
  index.number_of_replicas: 0

# Index lifecycle management
setup.ilm.enabled: true
setup.ilm.rollover_alias: "cacheforge-logs"
setup.ilm.pattern: "{now/d}-000001"
setup.ilm.policy: |
  {
    "policy": {
      "phases": {
        "hot": {
          "actions": {
            "rollover": {
              "max_size": "1GB",
              "max_age": "1d"
            }
          }
        },
        "warm": {
          "min_age": "7d",
          "actions": {
            "allocate": {
              "number_of_replicas": 0
            }
          }
        },
        "delete": {
          "min_age": "30d"
        }
      }
    }
  }

logging.level: info
logging.to_files: true
logging.files:
  path: /var/log/filebeat
  name: filebeat
  keepfiles: 7